name: Feature request
description: Suggest an idea or a new widget
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: textarea
    id: alt
    attributes:
      label: Alternatives you considered